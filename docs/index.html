  <body class="bg-slate-900 text-slate-100 font-['Plus_Jakarta_Sans',sans-serif] min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div id="loading-container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f172a; color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);">
          ⚡
        </div>
        <h1 style="font-size: 22px; font-weight: 800; margin: 0 0 8px 0; color: #ffffff;">FlipQuiz</h1>
        <p id="loading-text" style="font-size: 14px; color: #94a3b8; margin: 0 0 24px 0;">Caricamento della piattaforma didattica...</p>
        <div id="loading-spinner" style="width: 36px; height: 36px; border: 3px solid rgba(99, 102, 241, 0.2); border-top-color: #6366f1; border-radius: 50%; animation: fq-spin 0.8s linear infinite;"></div>
        
        <div id="diagnostic-box" style="display: none; margin-top: 24px; max-width: 520px; background: rgba(30, 41, 59, 0.95); border: 1px solid rgba(99, 102, 241, 0.4); border-radius: 16px; padding: 22px; text-align: left; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
          <div style="font-weight: 800; color: #f59e0b; font-size: 15px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
            <span>⚠️</span> Avvio su GitHub Pages
          </div>
          <p style="font-size: 13px; color: #cbd5e1; line-height: 1.5; margin: 0 0 14px 0;">
            I file sorgente TypeScript (.tsx) non sono compilati da GitHub senza build. Apri la pagina della versione compilata in <strong>/docs/</strong> oppure imposta la cartella <strong>/docs</strong> nelle impostazioni di GitHub Pages:
          </p>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <button onclick="var p=window.location.pathname; if(p.indexOf('/docs')===-1){ window.location.href=(p.endsWith('/')?p:p+'/')+'docs/'+window.location.search+window.location.hash; } else { window.location.reload(); }" style="display: block; text-align: center; background: linear-gradient(135deg, #4f46e5, #7c3aed); color: #ffffff; text-decoration: none; font-weight: 700; font-size: 13px; padding: 12px 16px; border-radius: 10px; border: none; cursor: pointer;">
              🚀 Apri Versione Compilata Pronta dell'App (/docs/)
            </button>
            <button onclick="window.location.reload()" style="background: rgba(255,255,255,0.08); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.15); font-weight: 600; font-size: 12px; padding: 8px 12px; border-radius: 10px; cursor: pointer;">
              🔄 Ricarica Pagina
            </button>
          </div>
        </div>

        <script>
          // Automatic fallback for static GitHub Pages if uncompiled root index.html is loaded directly
          setTimeout(function() {
            if (!window.__FLIPQUIZ_MOUNTED__) {
              var isGh = window.location.hostname.indexOf('github.io') !== -1;
              var path = window.location.pathname;
              if (isGh && path.indexOf('/docs') === -1) {
                var target = path.endsWith('/') ? path : path + '/';
                target += 'docs/' + window.location.search + window.location.hash;
                window.location.replace(target);
                return;
              }
              var diag = document.getElementById('diagnostic-box');
              if (diag) diag.style.display = 'block';
            }
          }, 1500);
        </script>

        <style>@keyframes fq-spin{to{transform:rotate(360deg)}}</style>
        <noscript>
          <div style="margin-top: 24px; padding: 12px 20px; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; color: #fca5a5; font-size: 13px;">
            JavaScript è disabilitato. Abilita JavaScript per eseguire FlipQuiz.
          </div>
        </noscript>
      </div>
    </div>
